name: gatenet
description: "Gatenet — EVM Savings Wallet with On-Chain Vault"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Web3 / Blockchain
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0

  # Networking
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Storage & Security
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # UI
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  fluttertoast: ^8.2.8
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
